# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
# Run manually: prek run --all-files
#:schema https://www.schemastore.org/prek.json

auto_update.cooldown_days = 30
minimum_prek_version = "0.4.3"
default_language_version.python = "3.12"
default_language_version.golang = "1.24"

# All hooks at the same priority level will run *concurrently* (in parallel),
# and hooks with a lower priority will run before hooks with a higher priority.
# See: https://prek.j178.dev/proposals/concurrency
#
# Priority 0: built-in hooks that modify files (e.g. fix line endings, remove trailing whitespace)
# Priority 1: language linters that modify files (go fmt)
# Priority 2: language linters that don't modify files (codespell, golangci-lint), and should rely on the already-modified files from priority 0 and 1 hooks

# NOTE: golangci-lint is intentionally NOT run via prek for this repository
# because the Go lint step depends on generated code produced by `make generate`
# (protobuf bindings, RBAC policies, store mocks). Run `make check` to perform
# the full Go lint/format check. The `golangci-lint-config-verify` hook below
# only validates the static config and does not require generated files.

# Linting of GitHub Actions workflows for security issues
# https://docs.zizmor.sh/audits/
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.26.1"

[[repos.hooks]]
id = "zizmor"
args = [
    "--no-progress",
    "--fix"
]

# Spell checking
[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.2"

[[repos.hooks]]
id = "codespell"
args = [
  "--ignore-words-list",
  "ue,ot,ues,fo,nd,ist,te,parm,parms,ser,iif,iam,nin",
  # vendored UI assets and generated/binary content are noisy for codespell
  "--skip",
  "*.svg,*.lock,*.sum,src/js/yarn.lock,src/js/dist/*,src/go/web/public/*,src/go/web/proto/*.pb.go,src/go/store/mock.go,src/go/web/rbac/known_policy.go,**/*.min.js,**/*.min.css"
]
priority = 2


# Shell: ShellCheck (checks shell scripts for common issues)
# Unfortunately, ShellCheck's standard pre-commit hook calls into Docker,
#   which doesn't work well in CI, since the CI runs in a container.
# Instead, use this neat hack that uses Python pip to download and
#   install the ShellCheck binary.
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"

[[repos.hooks]]
id = "shellcheck"
priority = 2


# Go: golangci-lint config verify (does not require generated files)
[[repos]]
repo = "https://github.com/golangci/golangci-lint"
# NOTE: need at least v2.12.0 for config verify command to work in pre-commit/prek
rev = "v2.12.2"

[[repos.hooks]]
id = "golangci-lint-config-verify"
entry = "golangci-lint config verify -c src/go/.golangci.yml"
language_version = "1.25"  # needed for golangci-lint v2.12.2
priority = 1


# Dockerfile: hadolint
# hadolint-py uses python pip to download and install the hadolint binary.
# This is used instead of using Docker like the official hadolint
# pre-commit hook, so it can work in CI without docker-in-docker.
[[repos]]
repo = "https://github.com/AleksaC/hadolint-py"
rev = "v2.14.0"

[[repos.hooks]]
id = "hadolint"
# DL3059 - Ignore consecutive RUN instructions in Dockerfile
args = ["--ignore", "DL3059"]
priority = 1


# YAML: yamllint
[[repos]]
repo = "https://github.com/adrienverge/yamllint.git"
rev = "v1.29.0"

[[repos.hooks]]
id = "yamllint"
args = [
    "--strict",
    "--config-file=.yamllint.yml"
]
priority = 2


# Enforce conventional commit messages
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = [
  "feat",
  "fix",
  "docs",
  "style",
  "refactor",
  "test",
  "chore"
]
priority = 1


# General checks built into prek
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]
types_or = [
  "python",
  "go",
  "markdown",
  "yaml",
  "json"
]
exclude = '(^src/js/dist/|^src/go/web/public/|^src/go/web/proto/.*\.pb\.go$|^src/go/store/mock\.go$|^src/go/web/rbac/known_policy\.go$)'
priority = 0

[[repos.hooks]]
id = "check-added-large-files"
priority = 1

[[repos.hooks]]
id = "check-case-conflict"
priority = 1

[[repos.hooks]]
id = "check-illegal-windows-names"
priority = 1

[[repos.hooks]]
id = "end-of-file-fixer"
types_or = [
  "python",
  "go",
  "markdown"
]
exclude = '(^src/js/dist/|^src/go/web/public/|^src/go/web/proto/.*\.pb\.go$|^src/go/store/mock\.go$|^src/go/web/rbac/known_policy\.go$)'
priority = 0

[[repos.hooks]]
id = "fix-byte-order-marker"
priority = 0

[[repos.hooks]]
id = "check-yaml"
priority = 1

[[repos.hooks]]
id = "check-json"
exclude = "^devcontainer.json$"
priority = 1

[[repos.hooks]]
id = "check-merge-conflict"
priority = 1

[[repos.hooks]]
id = "check-executables-have-shebangs"
exclude = { glob = [
    "**/*.desktop",
    "**/*.ps1",
    "**/*.bat",
    "**/*.cmd",
    "src/js/**",
]}
priority = 1

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"
exclude = '^.*\.mako$'
priority = 1

[[repos.hooks]]
id = "check-symlinks"
priority = 1

[[repos.hooks]]
id = "check-toml"
priority = 1

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=no"]
priority = 0

[[repos.hooks]]
id = "check-vcs-permalinks"
description = "Ensures that links to vcs websites are permalinks"
priority = 1

[[repos.hooks]]
id = "no-commit-to-branch"
name = "branch name validation"
description = "Prevent committing to 'main', 'master', or any branch that aren't kebab-case (only allows letters, numbers, and hyphens)"
args = [
  "--branch",
  "main",
  "--branch",
  "master",
  "--pattern",
  '.*[^\w-].*'
]
priority = 1
