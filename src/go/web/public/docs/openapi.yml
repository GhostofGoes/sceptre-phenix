openapi: 3.0.0
info:
  description: phenix API
  version: 0.0.0
  title: phenix
  termsOfService: http://swagger.io/terms/
  contact:
    url: https://github.com/sandialabs/sceptre-phenix
  license:
    name: GNU General Public License v3.0
tags:
  - name: Configs
    description: Config details and controls
  - name: Schemas
    description: Config spec schemas
  - name: Experiments
    description: Experiments details and controls
  - name: Virtual Machines
    description: >
      Experiment VM details and controls. Every route of an experiment's VMs
      answers 400 for a VM name that minimega cannot take as one command
      argument, or would read as a list (a,b), a range (vm[1-3]), a VM ID (a
      number) or its wildcard `all`, and 409 while phenix ui stops the
      experiment.
  - name: Hosts
    description: Cluster host details
  - name: Applications
    description: Available phenix user applications
  - name: Topologies
    description: Available phenix topologies
  - name: Builder
    description: Graphical topology Builder diagrams and the topologies built from them
  - name: Disks
    description: Available phenix disk images
  - name: Users
    description: User details and controls
  - name: Workflow
    description: Workflow config upserts and applies, and the server options clients read
paths:
  "/configs":
    get:
      tags:
        - Configs
      summary: Get all phenix configs
      description: ""
      operationId: getConfigs
      parameters:
        - name: kind
          in: query
          description: limit configs to specified kind (defaults to all)
          required: false
          schema:
            type: string
            enum:
              - all
              - topology
              - scenario
              - experiment
              - image
              - user
              - role
            default: all
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configs"
    post:
      tags:
        - Configs
      summary: Create new phenix config
      description: ""
      operationId: postConfigs
      requestBody:
        description: phenix config creation parameters
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
          multipart/form-data:
            schema:
              type: object
              properties:
                fileupload:
                  type: string
                  format: binary
      responses:
        "201":
          description: successful config creation
          headers:
            Location:
              schema:
                description: location of newly created config
                type: string
                format: uri
        "400":
          description: >
            unknown content type or file extension, unparsable body (the parser
            error in metadata.validation), unknown kind, a config with the same
            name that already exists, a schema validation failure (explained
            lines in metadata.validation, original validator text in
            metadata.validation-raw), or a config hook or the store rejects the
            config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: creating configs is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the request or the uploaded file cannot be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/configs/{kind}/{name}":
    get:
      tags:
        - Configs
      summary: Get existing phenix config
      description: ""
      operationId: getConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to get
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to get
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/Config"
    put:
      tags:
        - Configs
      summary: Update existing phenix config
      description: >
        Can also be used to rename a config by changing the name in the metadata
        portion of the config header and using the old name in the request path.
        A rename needs the configs create and update permissions on the new
        name and the configs delete permission on the old one; the kind cannot
        change.
      operationId: putConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to get
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to get
          required: true
          schema:
            type: string
      requestBody:
        description: phenix config update parameters
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
          multipart/form-data:
            schema:
              type: object
              properties:
                fileupload:
                  type: string
                  format: binary
      responses:
        "204":
          description: successful config update
          headers:
            Location:
              schema:
                description: location of updated config
                type: string
                format: uri
        "400":
          description: >
            unknown content type or file extension, a config that does not exist,
            an unknown kind, a body of another kind than the path, a schema
            validation failure (explained lines in
            metadata.validation, original validator text in
            metadata.validation-raw), or a config hook or the store rejects the
            config; for an Experiment config, also a failure to reconfigure the
            experiment after the updated config was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: updating the config, or renaming it to the body's name, is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the request or the uploaded file cannot be read or parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Configs
      summary: Delete existing phenix config
      description: ""
      operationId: deleteConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to delete
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/schemas/{version}":
    get:
      tags:
        - Schemas
      summary: Get full schema (all config specs) for specific version
      description: ""
      operationId: getSchemasVersion
      parameters:
        - name: version
          in: path
          description: version of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - "v0"
              - "v1"
              - "v2"
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/x-yaml:
              schema:
                type: object
                additionalProperties: true
  "/schemas/{kind}/{version}":
    get:
      tags:
        - Schemas
      summary: Get schema for specific config spec kind/version
      description: the Workflow schema exists only in version v0, which holds no other kind
      operationId: getSchemasKindVersion
      parameters:
        - name: kind
          in: path
          description: kind of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - topology
              - scenario
              - experiment
              - image
              - user
              - role
              - workflow
        - name: version
          in: path
          description: version of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - "v0"
              - "v1"
              - "v2"
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/x-yaml:
              schema:
                type: object
                additionalProperties: true
  "/experiments":
    get:
      tags:
        - Experiments
      summary: Get all phenix experiments
      description: ""
      operationId: getExperiments
      parameters:
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiments"
    post:
      tags:
        - Experiments
      summary: Create new phenix experiment
      description: ""
      operationId: postExperiments
      requestBody:
        description: phenix experiment creation parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                topology:
                  type: string
                apps:
                  type: array
                  items:
                    type: string
                vlan_min:
                  type: integer
                  description: >-
                    The VLAN range's min, the first VLAN ID minimega may assign,
                    1-4095; set it with vlan_max, or leave both 0 for minimega's
                    default pool.
                vlan_max:
                  type: integer
                  description: >-
                    The VLAN range's max, 2-4096 and above vlan_min; minimega
                    assigns VLAN IDs below it, never the max itself.
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          description: >
            the experiment cannot be created, for example for a refused VLAN
            range, an unknown topology or an invalid name
        "403":
          description: creating the experiment is not allowed
        "409":
          description: an experiment of the name is being created
        "500":
          description: the request cannot be read or parsed
  "/experiments/{name}":
    get:
      tags:
        - Experiments
      summary: Get existing phenix experiment
      description: ""
      operationId: getExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
    delete:
      tags:
        - Experiments
      summary: Delete existing phenix experiment
      description: ""
      operationId: deleteExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
    patch:
      tags:
        - Experiments
      summary: Set the VLAN IDs of the VLAN aliases of a stopped experiment
      description: >-
        The body maps VLAN aliases the experiment has to VLAN IDs; aliases it
        does not have are ignored. An ID of 0 lets minimega choose the
        alias's VLAN ID again. Any other ID must be 1-4095 and, when the
        experiment has a VLAN range, from its min up to, but not including,
        its max, as `phenix vlan set` requires.
      operationId: patchExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to update
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: integer
              example:
                EXP: 101
      responses:
        "200":
          description: successful operation
        "400":
          description: the experiment is running, or a VLAN ID is refused
        "403":
          description: the user may not update the experiment
        "500":
          description: >-
            the experiment cannot be read or stored, or the body is not a JSON
            object of VLAN IDs
  "/experiments/{name}/start":
    post:
      tags:
        - Experiments
      summary: Start existing phenix experiment
      description: ""
      operationId: postExperimentsNameStart
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to start
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
  "/experiments/{name}/stop":
    post:
      tags:
        - Experiments
      summary: Stop existing phenix experiment
      description: ""
      operationId: postExperimentsNameStop
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to stop
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
  "/experiments/{name}/schedule":
    get:
      tags:
        - Experiments
      summary: Get current schedule for existing experiment
      description: ""
      operationId: getExperimentsNameSchedule
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get schedule for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
    post:
      tags:
        - Experiments
      summary: Update current schedule for existing experiment
      description: ""
      operationId: postExperimentsNameSchedule
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to update schedule for
          required: true
          schema:
            type: name
      requestBody:
        description: scheduling algorithm to use
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                algorithm:
                  type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
  "/experiments/{name}/captures":
    get:
      tags:
        - Experiments
      summary: Get captures for existing experiment
      description: ""
      operationId: getExperimentsNameCaptures
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get captures for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Captures"
  "/experiments/{name}/files":
    get:
      tags:
        - Experiments
      summary: Get list of files for experiment
      description: ""
      operationId: getExperimentsNameFiles
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get files for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Files"
  "/experiments/{name}/files/{filename}":
    get:
      tags:
        - Experiments
      summary: Download experiment file
      description: ""
      operationId: getExperimentsNameFilesFilename
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get file from
          required: true
          schema:
            type: string
        - name: filename
          in: path
          description: name of file download
          required: true
          schema:
            type: string
        - name: path
          in: query
          description: >
            path of the file in the experiment's files directory, which may
            name a subdirectory; defaults to the filename
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: the file is a packet capture still in progress
        "500":
          description: the file cannot be read
  "/experiments/{exp_name}/netflow":
    get:
      tags:
        - Experiments
      summary: Check whether the experiment captures netflow
      description: ""
      operationId: getExperimentsNameNetflow
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      responses:
        "204":
          description: the experiment captures netflow
        "404":
          description: the experiment captures no netflow
    post:
      tags:
        - Experiments
      summary: Start capturing the experiment's netflow
      description: ""
      operationId: postExperimentsNameNetflow
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
        "400":
          description: the experiment does not exist, or already captures netflow
        "409":
          description: >
            the experiment is stopped or a dry run, or its default bridge is
            phenix
        "500":
          description: the capture cannot start
    delete:
      tags:
        - Experiments
      summary: Stop capturing the experiment's netflow
      description: ""
      operationId: deleteExperimentsNameNetflow
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
        "404":
          description: the experiment captures no netflow
        "500":
          description: the capture cannot stop
  "/experiments/{exp_name}/netflow/ws":
    get:
      tags:
        - Experiments
      summary: Stream the experiment's netflow records over a WebSocket
      description: ""
      operationId: getExperimentsNameNetflowWs
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      responses:
        "101":
          description: switching protocols
        "404":
          description: the experiment captures no netflow
  "/experiments/{name}/scorch/pipelines":
    get:
      tags:
        - Experiments
      summary: Get the SCORCH pipelines of the experiment and the run executing
      description: ""
      operationId: getExperimentsNameScorchPipelines
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            the pipelines, one per run and loop, and the ID of the run
            executing, or -1
          content:
            application/json:
              schema:
                type: object
                properties:
                  pipelines:
                    type: array
                    items:
                      type: object
                  running:
                    type: integer
        "400":
          description: the experiment does not exist
        "500":
          description: the experiment's SCORCH configuration cannot be read
  "/experiments/{name}/scorch/pipelines/{run}/{loop}":
    get:
      tags:
        - Experiments
      summary: Get the SCORCH pipeline of a run and loop
      description: ""
      operationId: getExperimentsNameScorchPipelinesRunLoop
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: run
          in: path
          description: index of the SCORCH run
          required: true
          schema:
            type: integer
        - name: loop
          in: path
          description: index of the loop of the run
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
        "400":
          description: the run or loop is not a number, or has no pipeline
  "/experiments/{name}/scorch/pipelines/{run}":
    post:
      tags:
        - Experiments
      summary: Start a SCORCH run
      description: ""
      operationId: postExperimentsNameScorchPipelinesRun
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: run
          in: path
          description: index of the SCORCH run to start
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: the run started
        "400":
          description: >
            the run is not a number, the experiment does not exist, or the
            run cannot start, for example because the experiment is not
            running or has no such run
        "409":
          description: >
            a run of the experiment already executes, or the experiment is
            stopping
    delete:
      tags:
        - Experiments
      summary: Cancel a SCORCH run, which then runs its stop and cleanup stages
      description: ""
      operationId: deleteExperimentsNameScorchPipelinesRun
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: run
          in: path
          description: index of the SCORCH run to cancel
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: successful operation, also when the run does not execute
        "400":
          description: the run is not a number
  "/experiments/{exp_name}/vms":
    get:
      tags:
        - Virtual Machines
      summary: get all VMs in existing experiment
      description: ""
      operationId: getExperimentsNameVms
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to get VMs for
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMs"
        "400":
          description: the experiment does not exist
        "500":
          description: the VMs of a running experiment cannot be read from minimega, for example while it is down
          content:
            text/plain:
              schema:
                type: string
  "/experiments/{exp_name}/vms/{vm_name}":
    get:
      tags:
        - Virtual Machines
      summary: get given VM in existing experiment
      description: ""
      operationId: getExperimentsNameVmName
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to get VM from
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix experiment VM to get
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
    patch:
      tags:
        - Virtual Machines
      summary: Update existing VM settings in existing experiment
      description: ""
      operationId: patchExperimentsNameVmsName
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to modify
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to modify
          required: true
          schema:
            type: string
      requestBody:
        description: phenix virtual machine patch parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                  description: >
                    the cluster host to schedule the VM on, by the name GET
                    /hosts lists, which is mapped to the name minimega gives
                    the host, or by minimega's name; a name of no cluster
                    host is refused, and empty clears the schedule
                cpus:
                  type: integer
                ram:
                  type: integer
                disk:
                  type: string
                  description: >
                    the image the VM boots from, of a stopped experiment: a
                    disk of a node in the topology, or an image directly in
                    minimega's files directory that is not a disk snapshot
                    phenix made at start (a name ending in _snapshot); with
                    snapshot false, only a disk the topology gave a node
                dnb:
                  type: boolean
                snapshot:
                  type: boolean
                  description: >
                    whether the VM boots a throwaway snapshot of its disk; a VM
                    with false writes its disk, so false needs a disk the
                    topology gave a node, not one only a disk change picked
                interface:
                  type: object
                  description: >
                    the interface to connect to another VLAN, only while the
                    experiment runs; a stopped experiment ignores it
                  properties:
                    index:
                      type: integer
                    vlan:
                      type: string
                      description: >
                        the VLAN alias or ID to connect the interface to, as
                        minimega takes it; empty disconnects the interface
                tags:
                  type: object
                  description: the VM's labels, which tag_update_mode applies
                  additionalProperties:
                    type: string
                tag_update_mode:
                  type: string
                  description: >
                    NONE leaves the labels as they are, SET replaces them with
                    tags, and ADD adds tags to them, replacing labels of the
                    same key
                  enum:
                    - NONE
                    - SET
                    - ADD
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: >
            invalid request body, a host that names no cluster host or
            several, a label of a running VM that minimega cannot store as a
            tag, an interface VLAN or the experiment's default bridge that
            minimega cannot take as one argument, or a disk that is neither a
            topology disk nor directly in minimega's files directory, is a
            disk snapshot, is not a plain path, or is not a disk the topology
            gave a node while the VM would have snapshot false
        "500":
          description: >
            the host cannot be looked up in minimega, or the VM cannot be
            updated, for example because it is no node of the topology or a
            disk is given for a node without one
    delete:
      tags:
        - Virtual Machines
      summary: Delete phenix experiment VM
      description: ""
      operationId: deleteExperimentsNameVmsName
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
        "400":
          description: >
            the experiment does not exist, is stopped, or is a dry run, or
            minimega runs no VM of the name
  "/experiments/{exp_name}/vms/{vm_name}/start":
    post:
      tags:
        - Virtual Machines
      summary: start VM in experiment
      description: ""
      operationId: postExperimentsNameVMsNameStart
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to start
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: the experiment is stopped or is a dry run, or minimega runs no VM of the name
        "404":
          description: the experiment does not exist
        "409":
          description: the VM is locked by another operation
  "/experiments/{exp_name}/vms/{vm_name}/stop":
    post:
      tags:
        - Virtual Machines
      summary: stop VM in experiment
      description: ""
      operationId: postExperimentsNameVMsNameStop
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to stop
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: the experiment is stopped or is a dry run, or minimega runs no VM of the name
        "404":
          description: the experiment does not exist
        "409":
          description: the VM is locked by another operation
  "/experiments/{exp_name}/vms/{vm_name}/redeploy":
    post:
      tags:
        - Virtual Machines
      summary: redeploy VM in experiment
      description: ""
      operationId: postExperimentsNameVMsNameRedeploy
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to redeploy
          required: true
          schema:
            type: string
        - name: replicate-injects
          in: query
          description: >
            for a request without a body, any value recreates the VM's disk
            snapshot and replays its injections and deletions; a request with
            a body sets injects instead, and this parameter is ignored
          required: false
          schema:
            type: string
      requestBody:
        description: >
          the settings to change; an empty body keeps the VM's CPUs, memory
          and disk
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cpus:
                  type: integer
                ram:
                  type: integer
                disk:
                  type: string
                  description: >
                    <image>[,<interface>][,<cache mode>], where the image is
                    a disk of a node in the topology, or is directly in
                    minimega's files directory and is not a disk snapshot
                    phenix made at start (a name ending in _snapshot); for a
                    VM with snapshot false, only a disk the topology gave a
                    node
                injects:
                  type: boolean
                  description: >
                    recreate the VM's disk snapshot and replay its injections
                    and deletions; replicate-injects does this for a request
                    without a body
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: >
            the body is not valid; the experiment is stopped or is a dry run;
            the VM is not a node of the topology or is external, or, when
            replicating injections, has no disk or runs with snapshot false; or the
            disk is neither a topology disk nor directly in minimega's files
            directory, is a disk snapshot, is not a plain path, or, for a VM
            with snapshot false, is not a disk the topology gave a node
        "404":
          description: the experiment does not exist
        "409":
          description: the VM is locked by another operation
        "500":
          description: the redeploy failed
  "/experiments/{exp_name}/vms/{vm_name}/cdrom":
    post:
      tags:
        - Virtual Machines
      summary: insert an optical disc into a running VM
      description: >
        Needs the vms/cdrom update permission. QEMU, running as root, attaches
        the file the path names, so phenix accepts only the images a redeploy
        disk may name.
      operationId: postExperimentsNameVMsNameCdrom
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to insert the disc into
          required: true
          schema:
            type: string
        - name: isoPath
          in: query
          description: >
            the image to insert: a disk of a node in the topology, or an
            image directly in minimega's files directory that is not a disk
            snapshot phenix made at start (a name ending in _snapshot); a
            relative path is in minimega's files directory
          required: true
          schema:
            type: string
      responses:
        "204":
          description: the disc was inserted
        "400":
          description: >
            the experiment is stopped or is a dry run, or the path is neither
            a topology disk nor directly in minimega's files directory, is a
            disk snapshot, or is not a plain path
        "403":
          description: the role may not change the VM's optical disc
        "404":
          description: the experiment does not exist
        "500":
          description: no isoPath was given, or minimega did not insert the disc
    delete:
      tags:
        - Virtual Machines
      summary: eject the optical disc of a running VM
      description: Needs the vms/cdrom delete permission.
      operationId: deleteExperimentsNameVMsNameCdrom
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to eject the disc of
          required: true
          schema:
            type: string
      responses:
        "204":
          description: the disc was ejected
        "400":
          description: the experiment is stopped or is a dry run
        "403":
          description: the role may not eject the VM's optical disc
        "404":
          description: the experiment does not exist
        "500":
          description: minimega did not eject the disc
  "/experiments/{exp_name}/vms/{vm_name}/screenshot.png":
    get:
      tags:
        - Virtual Machines
      summary: Get screenshot of running VM in experiment
      description: ""
      operationId: getExperimentsNameVmsNameScreenshot
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to get screenshot from
          required: true
          schema:
            type: string
        - name: size
          in: query
          description: >
            the screenshot's maximum dimension in pixels, which minimega
            scales it to; 215 when not given
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 4096
        - name: base64
          in: query
          description: whether or not to base64 encode the screenshot image
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: successful operation
          content:
            image/png:
              schema:
                type: string
                format: base64
        "400":
          description: >
            VM not found, the size is not a whole number from 0 to 4096, the
            experiment is stopped or a dry run, or minimega returned no
            screenshot
        "404":
          description: the experiment does not exist
        "409":
          description: VM is not running, for example paused or powered off
