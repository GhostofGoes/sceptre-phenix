          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to get snapshots for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshots"
    post:
      tags:
        - Virtual Machines
      summary: create phenix experiment VM snapshot
      description: ""
      operationId: postExperimentsNameVmsNameSnapshots
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to snapshot
          required: true
          schema:
            type: string
      requestBody:
        description: phenix VM snapshot parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
                  maxLength: 128
                  description: the snapshot name, which may not contain ".."
      responses:
        "204":
          description: successful operation
        "400":
          description: >
            the request body or the snapshot name is invalid, the experiment
